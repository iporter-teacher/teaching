

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Submission Checklist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4 sm:px-6">
   <main class="max-w-2xl mx-auto bg-white border border-slate-200 rounded-xl shadow-sm p-6 sm:p-10 space-y-6">
    <header class="space-y-3">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">Assignment Submission Checklist (Assignment Specifications)</h1>
      <p class="text-slate-600 text-sm sm:text-base leading-relaxed">Assignment specifications describe what you need to do to earn credit for the assignment. Use this checklist to help you understand the assignment expectations.</p>
    </header>

    <div id="checklist-container" class="space-y-4">
      <div class="flex items-start gap-3">
        <input type="checkbox" id="item-0" class="checklist-item mt-1 h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0">
        <label for="item-0" class="cursor-pointer text-sm sm:text-base leading-relaxed select-none transition-colors">Compose a professional letter of <strong>approximately 400–500 words.</strong></label>
      </div>
      <div class="flex items-start gap-3">
        <input type="checkbox" id="item-1" class="checklist-item mt-1 h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0">
        <label for="item-1" class="cursor-pointer text-sm sm:text-base leading-relaxed select-none transition-colors">Follow <a href="https://students.tippie.uiowa.edu/sites/students.tippie.uiowa.edu/files/2026-04/Business-Letter-Template.pdf" target="_blank" rel="noopener noreferrer" class="text-indigo-600 underline underline-offset-2 hover:text-indigo-800">basic formatting for a professional letter</a>.</label>
      </div>
      <div class="flex items-start gap-3">
        <input type="checkbox" id="item-2" class="checklist-item mt-1 h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0">
        <label for="item-2" class="cursor-pointer text-sm sm:text-base leading-relaxed select-none transition-colors">Invite your friend/family member to cultivate curiosity about their political opponent's perspectives.</label>
      </div>

  <div class="flex items-start gap-3">
        <input type="checkbox" id="item-2" class="checklist-item mt-1 h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0">
        <label for="item-2" class="cursor-pointer text-sm sm:text-base leading-relaxed select-none transition-colors">Help your friend/family member understand how different moral values and life experiences can underlie different good faith perspectives, while also recognizing that bad faith arguments, hatred, and bigotry play a role in political conversations.</label>
      </div>
      <div class="flex items-start gap-3">
        <input type="checkbox" id="item-3" class="checklist-item mt-1 h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0">
        <label for="item-3" class="cursor-pointer text-sm sm:text-base leading-relaxed select-none transition-colors">Summarize Moral Foundations Theory.</label>
      </div>
      <div class="flex items-start gap-3">
        <input type="checkbox" id="item-4" class="checklist-item mt-1 h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0">
        <label for="item-4" class="cursor-pointer text-sm sm:text-base leading-relaxed select-none transition-colors">Describe in detail how a moral value can underlie a belief.</label>
      </div>
      <div class="flex items-start gap-3">
        <input type="checkbox" id="item-5" class="checklist-item mt-1 h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0">
        <label for="item-5" class="cursor-pointer text-sm sm:text-base leading-relaxed select-none transition-colors">Identify and explain a concept or framework from <em>Perspectives by CDI</em> that clarifies a point you are making.</label>
      </div>
      <div class="flex items-start gap-3">
        <input type="checkbox" id="item-6" class="checklist-item mt-1 h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0">
        <label for="item-6" class="cursor-pointer text-sm sm:text-base leading-relaxed select-none transition-colors">Cite <em>Perspectives by CDI</em>.</label>
      </div>
      <div class="flex items-start gap-3">
        <input type="checkbox" id="item-7" class="checklist-item mt-1 h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0">
        <label for="item-7" class="cursor-pointer text-sm sm:text-base leading-relaxed select-none transition-colors">Include a well-formatted in-text citation in the sentence where you quoted the source (note: use the document page number, since we don't have the original page numbers).</label>
      </div>
      <div class="flex items-start gap-3">
        <input type="checkbox" id="item-8" class="checklist-item mt-1 h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0">
        <label for="item-8" class="cursor-pointer text-sm sm:text-base leading-relaxed select-none transition-colors">Include a Works Cited section at the end of the letter with the full MLA citation for the source.</label>
      </div>
      <div class="flex items-start gap-3">
        <input type="checkbox" id="item-9" class="checklist-item mt-1 h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer shrink-0">
        <label for="item-9" class="cursor-pointer text-sm sm:text-base leading-relaxed select-none transition-colors">Include an Authenticity Statement in the document in which you state something like (in your own words): "This document represents my own authentic work without the assistance of generative AI." If you would like, you can also provide specific details about what tools you did use (e.g., a dictionary, thesaurus, search engine for X, etc.).</label>
      </div>
    </div>

    <div class="pt-4 border-t border-slate-100 flex justify-end">
      <button type="button" id="reset-btn" class="text-xs text-slate-400 hover:text-slate-600 transition-colors p-1" aria-label="Clear checklist">Clear</button>
    </div>
  </main>


  <script>
    const STORAGE_KEY = 'narrative_essay_checklist_state';
    const checkboxes = document.querySelectorAll('.checklist-item');
    const resetBtn = document.getElementById('reset-btn');

    function updateLabelStyle(checkbox) {
      const label = document.querySelector(`label[for="${checkbox.id}"]`);
      if (!label) return;
      if (checkbox.checked) {
        label.classList.add('text-slate-400', 'line-through');
        label.classList.remove('text-slate-800');
      } else {
        label.classList.remove('text-slate-400', 'line-through');
        label.classList.add('text-slate-800');
      }
    }

    function saveState() {
      const state = {};
      checkboxes.forEach((cb) => {
        state[cb.id] = cb.checked;
      });
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Fallback if localStorage is unavailable
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const state = JSON.parse(raw);
          checkboxes.forEach((cb) => {
            if (state[cb.id] !== undefined) {
              cb.checked = Boolean(state[cb.id]);
            }
            updateLabelStyle(cb);
          });
          return;
        }
      } catch (e) {
        // Ignore storage access errors
      }
      checkboxes.forEach(updateLabelStyle);
    }

    checkboxes.forEach((cb) => {
      cb.addEventListener('change', () => {
        updateLabelStyle(cb);
        saveState();
      });
    });

    resetBtn.addEventListener('click', () => {
      checkboxes.forEach((cb) => {
        cb.checked = false;
        updateLabelStyle(cb);
      });
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {
        // Ignore storage errors
      }
    });

    loadState();
  </script>
</body>
</html>
